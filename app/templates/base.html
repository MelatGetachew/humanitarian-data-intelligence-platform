<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Humanitarian Data Platform{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
        nav { border-bottom: 1px solid #ddd; padding-bottom: 10px; margin-bottom: 20px; }
        nav a { margin-right: 15px; text-decoration: none; color: #1a5fb4; }
        .stats { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
        .stat { background: #f4f4f4; padding: 12px 18px; border-radius: 6px; }
        .stat strong { display: block; font-size: 1.3em; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
